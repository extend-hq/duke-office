<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Arimo</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Tinos</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Cousine</family></accept></alias>
  <alias binding="same"><family>Aptos</family><accept><family>Intos</family></accept></alias>
  <alias binding="same"><family>Aptos Narrow</family><accept><family>Intos Narrow</family></accept></alias>
</fontconfig>
