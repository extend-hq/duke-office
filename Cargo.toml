[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/extend-hq/rust-office"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
miniz_oxide = "0.8"
thiserror = "2"
quick-xml = "0.37"
zip = { version = "9", default-features = false, features = ["deflate"] }
cfb = "0.10"
flate2 = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
