name: Release crates
on:
  pull_request:
    branches: [main]
    paths: &release-paths
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/release.py'
      - 'scripts/github_releases.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/check.yml'
  push:
    branches: [main]
    paths: *release-paths
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the release without uploading packages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.0
      - id: plan
        run: python3 scripts/release.py dry-run

  verify:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.plan.outputs.pending == 'true')
    uses: ./.github/workflows/check.yml

  publish:
    needs: [plan, verify]
    if: >-
      github.repository == 'extend-hq/rust-office' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.plan.outputs.pending == 'true') ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.0
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
        id: registry
      - run: python3 scripts/release.py publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
      - run: python3 scripts/github_releases.py
        env:
          GH_TOKEN: ${{ github.token }}
