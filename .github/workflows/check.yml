name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - run: python3 -m unittest discover -s scripts -p test_release.py
      - run: python3 scripts/release.py check-workspace
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --locked --target wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node browser/check.mjs
  wasm-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: python3 scripts/release.py check-workspace
      - run: cargo build --workspace --locked --target wasm32-unknown-unknown
