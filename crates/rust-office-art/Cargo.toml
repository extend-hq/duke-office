[package]
name = "rust-office-art"
version = "0.1.4"
edition.workspace = true
license = "MIT AND Apache-2.0 AND OFL-1.1"
repository.workspace = true
description = "Shared Office picture, shape, connector and saved SmartArt rendering for Rust and WebAssembly"
readme = "README.md"
keywords = ["ooxml", "drawingml", "svg", "pictures", "wasm"]
categories = ["graphics", "rendering"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
base64 = "0.22"
memchr = "2"
libm = { version = "0.2.16", default-features = false, features = ["force-soft-floats"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
serde.workspace = true
serde_bytes.workspace = true
quick-xml.workspace = true
roxmltree = "0.20"
kurbo = "0.13.1"
rustybuzz = "0.20.1"
