[package]
name = "rust-office-art"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Office picture rendering for native Rust and WebAssembly"
readme = "README.md"
keywords = ["ooxml", "drawingml", "svg", "pictures", "wasm"]
categories = ["graphics", "rendering"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
serde.workspace = true
