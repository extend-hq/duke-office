[package]
name = "extend-pptx-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the Extend PowerPoint parser"
readme = "README.md"
keywords = ["powerpoint", "pptx", "ppt", "wasm"]
categories = ["parser-implementations", "wasm"]

[lib]
name = "pptx_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
pptx-core = { package = "extend-pptx", path = "../extend-pptx", version = "0.1.0" }
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
