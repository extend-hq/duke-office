[package]
name = "rust-office-charts-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for the Office Open XML Cartesian chart renderer"
repository = "https://github.com/extend-hq/rust-office"
categories = ["wasm", "rendering"]
keywords = ["ooxml", "charts", "svg", "wasm"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-office-charts = { version = "0.1.0", path = "../rust-office-charts", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.123"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext"]
