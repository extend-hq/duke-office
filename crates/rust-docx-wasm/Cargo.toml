[package]
name = "rust-docx-wasm"
version = "0.2.19"
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the rust-docx parser and serializer"
repository = "https://github.com/extend-hq/rust-office"
documentation = "https://docs.rs/rust-docx-wasm"
keywords = ["docx", "doc", "ooxml", "parser", "wasm"]
categories = ["parser-implementations", "wasm"]
readme = "README.md"
include = ["src/**", "third-party/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "rust_docx_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-docx = { version = "=0.2.19", path = "../rust-docx" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]
