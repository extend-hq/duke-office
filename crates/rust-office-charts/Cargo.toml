[package]
name = "rust-office-charts"
version = "0.1.3"
edition = "2021"
license = "MIT AND OFL-1.1"
description = "Render Office Open XML charts to SVG from native Rust or WebAssembly"
repository = "https://github.com/extend-hq/rust-office"
keywords = ["ooxml", "chart", "docx", "xlsx", "pptx"]
categories = ["graphics", "rendering"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = ["extended-charts"]
extended-charts = ["dep:base64", "dep:miniz_oxide"]
map-fallback = ["extended-charts"]

[dependencies]
base64 = { version = "0.22", optional = true }
miniz_oxide = { version = "0.8", optional = true }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
