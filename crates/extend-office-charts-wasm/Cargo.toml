[package]
name = "extend-office-charts-wasm"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for the Office Open XML chart renderer"
repository = "https://github.com/extend-hq/extend-office"
categories = ["wasm", "rendering"]
keywords = ["ooxml", "charts", "svg", "wasm"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
extended-charts = ["extend-office-charts/extended-charts"]
map-fallback = ["extended-charts", "extend-office-charts/map-fallback"]

[dependencies]
extend-office-charts = { version = "0.1.1", path = "../extend-office-charts", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.123"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext"]
