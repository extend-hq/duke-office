[package]
name = "rust-pptx"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Parse PowerPoint PPTX and legacy PPT presentations into a structured model"
readme = "README.md"
keywords = ["powerpoint", "pptx", "ppt", "ooxml", "parser"]
categories = ["parser-implementations"]

[lib]
name = "rust_pptx"

[dependencies]
rust-office-art = { version = "=0.1.7", path = "../rust-office-art" }
rust-office-charts = { version = "=0.1.9", path = "../rust-office-charts", default-features = false, features = ["extended-charts"] }
base64 = "0.22"
compact_str = "=0.10.0"
memchr = "2"
cfb.workspace = true
flate2.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip.workspace = true
sha2 = "0.10"
unicode-segmentation = "=1.12.0"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64-simd = "=0.8.0"
