[package]
name = "peer-transmutation"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
transmutation = { version = "=0.3.5", default-features = false }
tokio = { version = "1", features = ["rt"] }
# transmutation uses quick-xml's serde support without enabling it.
quick-xml = { version = "0.41", features = ["serialize"] }

[profile.release]
opt-level = 3
lto = "thin"
